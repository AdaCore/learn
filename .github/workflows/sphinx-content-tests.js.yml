name: Sphinx Content Tests

on: [push, pull_request]

defaults:
  run:
    working-directory: frontend

jobs:
  sphinx-content:

    runs-on: ubuntu-26.04

    strategy:
      matrix:
        python-version: ['3.14']
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        # Pinned like the packages it installs; the action applies it as an
        # exact `pip==` requirement.
        pip-version: '26.2.1'
        cache: 'pip'
        # Named explicitly: the default pattern matches `requirements.txt`,
        # which is not the file the workflow installs, so the key would not
        # change when a pinned version does.
        cache-dependency-path: 'frontend/requirements_frozen.txt'
    - name: Enable Corepack
      run: corepack enable
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: 'frontend/pnpm-lock.yaml'
    - name: Install OS Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        crudini \
        graphviz \
        plantuml
    - name: Install GNAT FSF
      run: |
        ${GITHUB_WORKSPACE}/.github/workflows/install_toolchain.sh --gnat
    - name: Increase max user watches
      run: |
        echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && \
        sudo sysctl -p
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Python dependencies
      run: |
        pip install -r requirements_frozen.txt
        pip install -e python/rst_code_example_pipeline
    - name: Run SPHINX engine tests
      run: make SPHINXOPTS="-W" test_engine
    - name: Build HTML content
      run: make HIDDEN_BOOKS="" HIDDEN_CONTENTS="" cleanall webpack-production sphinx-production
    - name: Archive HTML content in artifact
      uses: actions/upload-artifact@v7
      with:
        name: learn-html
        path: |
          frontend/dist/html
        if-no-files-found: error
        retention-days: 1
        compression-level: 9
